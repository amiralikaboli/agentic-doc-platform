[project]
name = "myproject"
version = "0.1.0"
description = "Project stub"
requires-python = ">=3.12"
# Core: shared by all services
dependencies = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.27",
    "pgvector>=0.1",
    "grpcio>=1.60",
    "protobuf>=5.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
init = []
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0",
    "celery>=5.3",
    "redis>=6.0",
    "openai>=1.40",
]
# Retrieval service: embedding + reranking
retrieval = [
    "sentence-transformers>=5.0",
]
# Worker service: Celery tasks + semantic chunking
worker = [
    "celery>=5.3",
    "redis>=6.0",
    "numpy>=1.24",
    "sentence-transformers>=5.0",
]
# Build: proto compilation
build = [
    "grpcio-tools>=1.60",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "slow: mark test as slow",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
