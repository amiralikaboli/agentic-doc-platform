[project]
name = "myproject"
version = "0.1.0"
description = "Project stub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery>=5.3",
    "redis>=6.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pgvector>=0.1",
    "langchain>=0.1",
    "langchain-experimental>=0.0",
    "langchain-huggingface>=0.0",
    "sentence-transformers>=5.0",
    "python-multipart>=0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
