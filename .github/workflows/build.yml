name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - cpu
          - cuda
          - both

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            torch_variant: none
            base_image: python:3.12-slim
          - service: init
            torch_variant: none
            base_image: python:3.12-slim
          - service: retrieval
            torch_variant: cpu
            base_image: python:3.12-slim
          - service: retrieval
            torch_variant: cuda
            base_image: nvidia/cuda:13.3.1-runtime-ubuntu24.04
          - service: worker
            torch_variant: cpu
            base_image: python:3.12-slim
          - service: worker
            torch_variant: cuda
            base_image: nvidia/cuda:13.3.1-runtime-ubuntu24.04

    steps:
      - name: Check if job should run
        id: should_run
        run: |
          SHOULD_RUN=true
          if [ "${{ github.event.inputs.build_type }}" = "cpu" ] && [ "${{ matrix.torch_variant }}" = "cuda" ]; then
            SHOULD_RUN=false
          fi
          if [ "${{ github.event.inputs.build_type }}" = "cuda" ] && [ "${{ matrix.torch_variant }}" = "cpu" ]; then
            SHOULD_RUN=false
          fi
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.should_run.outputs.should_run == 'true'

      - name: Generate protobuf files
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-full python3-pip
          pip install grpcio-tools
          bash scripts/gen_proto.sh

      - uses: docker/setup-buildx-action@v3
        if: steps.should_run.outputs.should_run == 'true'

      - uses: docker/login-action@v3
        if: steps.should_run.outputs.should_run == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute image name
        if: steps.should_run.outputs.should_run == 'true'
        id: image
        run: |
          if [ "${{ matrix.torch_variant }}" = "none" ]; then
            IMAGE_SUFFIX=""
          else
            IMAGE_SUFFIX="-${{ matrix.torch_variant }}"
          fi
          echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}${IMAGE_SUFFIX}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        if: steps.should_run.outputs.should_run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            TORCH_VARIANT=${{ matrix.torch_variant }}
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
