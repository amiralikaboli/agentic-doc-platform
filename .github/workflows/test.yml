name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        run: ruff check src tests
      
      - name: Type check with mypy
        run: mypy src --ignore-missing-imports
      
      - name: Run unit tests with coverage
        run: pytest tests/unit --cov=src --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create .env for testing
        run: |
          cat > .env << 'EOF'
          DB_NAME=test_db
          DB_PORT=5432
          REDIS_PORT=6379
          API_PORT=8000
          GRPC_PORT=50051
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=testpass
          LOG_LEVEL=info
          EOF
      
      - name: Build api Docker image
        run: |
          docker build -f Dockerfile --build-arg SERVICE=api --build-arg ENVIRONMENT=ci -t test-api:latest .
      
      - name: Start services with docker compose
        run: |
          docker compose up -d postgres redis postgres-init api retrieval
      
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest pytest-asyncio
      
      - name: Wait for API to be healthy
        run: |
          python << 'EOF'
          import asyncio
          import httpx
          import sys
          
          async def wait_for_api():
              for i in range(60):
                  try:
                      async with httpx.AsyncClient(timeout=5.0) as client:
                          resp = await client.get('http://localhost:8000/health')
                          if resp.status_code == 200:
                              print('✓ API is healthy')
                              return
                  except Exception as e:
                      if i % 10 == 0:
                          print(f'Waiting for API... ({i}s)')
                  await asyncio.sleep(1)
              raise RuntimeError('API did not become healthy')
          
          asyncio.run(wait_for_api())
          EOF
      
      - name: Run integration tests
        run: |
          pip install -e ".[dev]"
          pytest tests/integration -v --tb=short
        env:
          API_URL: http://localhost:8000
      
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs
      
      - name: Stop services
        if: always()
        run: |
          docker compose down -v
