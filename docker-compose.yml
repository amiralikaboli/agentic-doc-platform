services:
  # 1. PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Broker & Backend for Celery
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. gRPC Retrieval Service
  retrieval:
    build: .
    container_name: grpc_retrieval
    ports:
      - "50051:50051"
    volumes:
      - .:/app
      - ./hf_cache:/app/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/app_db
    command: python -m src.api.protos.retrieval_server
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import grpc,sys; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. FastAPI Web Application
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - document_data:/app/data
      - ./hf_cache:/app/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/app_db
      - GRPC_RETRIEVAL_URL=retrieval:50051
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      retrieval:
        condition: service_healthy

  # 5. Celery Worker for Chunking & Embedding Execution
  celery_worker:
    build: .
    container_name: celery_worker
    restart: always
    volumes:
      - .:/app
      - document_data:/app/data
      - ./hf_cache:/app/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/app_db
    command: celery -A src.celery_app.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  document_data:
