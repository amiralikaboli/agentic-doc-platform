services:
  # 1. PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Broker & Backend for Celery
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. gRPC Retrieval Service — cold-start initializes models
  retrieval:
    build:
      context: .
      dockerfile: Dockerfile.retrieval
    container_name: grpc_retrieval
    ports:
      - "${GRPC_PORT}:50051"
    volumes:
      - .:/app
      - ./hf_cache:/app/.cache/huggingface
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('0.0.0.0:50051'); grpc.channel_ready_future(ch).result(timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 4. FastAPI Public API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fastapi_app
    ports:
      - "${API_PORT}:8000"
    volumes:
      - .:/app
      - document_data:/app/data
      - ./hf_cache:/app/.cache/huggingface
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      retrieval:
        condition: service_healthy

  # 5. Celery Worker — cold-start initializes models for tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery_worker
    restart: always
    volumes:
      - .:/app
      - document_data:/app/data
      - ./hf_cache:/app/.cache/huggingface
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  document_data:
